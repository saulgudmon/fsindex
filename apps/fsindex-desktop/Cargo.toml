[package]
name = "fsindex-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
capture = ["dep:image"]

[dependencies]
fsindex-core.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
libc.workspace = true
parking_lot.workspace = true
tracing-subscriber.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }

image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
tempfile = "3"
